# Tests on every code change (the daily workflow runs them again before each refresh).
name: ci
on:
  pull_request:
  push:
    paths: ["rpi/**", "tests/**", "scripts/**", "config/**", "requirements.txt", ".github/workflows/ci.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
