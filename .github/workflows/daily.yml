# Dynamic refresh: pulls every reachable real source, rebuilds the index, publishes docs/, commits the result.
# Each source is isolated: if one site blocks the runner, the rest still update and the failure is logged in
# data/refresh_log.csv + docs/data/status.json. Publishing is refused (not faked) if basket coverage is too low.
name: rpi-refresh
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"        # 10:30 IST daily (MoSPI item data lags ~12 days after month end; prices are daily)
permissions:
  contents: write
concurrency: rpi-refresh
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Refresh all sources and publish
        run: python -m rpi refresh
        env:
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
      - name: Commit updated data and site
        run: |
          git config user.name "rpi-bot"; git config user.email "rpi-bot@users.noreply.github.com"
          git add data/rpi.sqlite data/*.csv data/official data/mrp docs
          git diff --cached --quiet || git commit -m "refresh $(date -u +%F)"
          git pull --rebase --autostash || true
          git push
