# Rajkot Price Index (RPI) - settings
[project]
name = "Rajkot Price Index"
city = "Rajkot"
base_period = "2025-01"        # official-linked history starts Jan 2025

[paths]
db = "data/rpi.sqlite"
raw = "data/raw"
out = "docs"
basket = "data/basket.csv"
weights = "data/weights_cpi2024_gujarat_urban.csv"   # APPROX official-derived weights (see data/official/weights_*.csv); demo mode forces weights_demo.csv
commodity_map = "data/commodity_map.csv"
tariff_events = "data/tariff_events.csv"

[index]
min_matched = 2             # default min matched quotes for an item to give a relative
max_abs_log_change = 0.7    # monthly log-relative clip per quote (~2x). Documented robustness rule.
min_days_per_month = 1      # min observation days for a quote-month to count
bootstrap_reps = 2000        # Monte-Carlo reps for the published 95% CI (rpi/index/uncertainty.py); the numpy
                             # impute path makes this cost less than the old 200-rep run. Lower it with `rpi refresh --reps N`.
geks_window = 13
impute = "seasonal_trend"   # missing item relatives (nowcast months, splice months): long-run mean change + EB calendar-month deviation from 11 yrs of official data (rpi/seasonal.py; untouched-test RMSE -28%/-33%); falls back to the item's own 12-month drift
calibrate_wholesale = true  # mandi-fed items (F001 F004 F022 F023 F025): wholesale change is shrunk with a pooled beta and fused with the seasonal prior (data/official/wholesale_calibration.csv) instead of being used one-for-one

[index.min_days_by_source]   # volatile daily feeds: a month needs >=5 days (partial months are imputed, not trusted)
mandi_gondal = 5
mandi_rajkot_apmc = 5
yard_rajkot_board = 5
mandi_rajkot_district = 5
mandi_rajkot_veg = 5
necc_ahmedabad = 5
gr_metals = 5
doca_rajkot = 5
doca_national = 5
doca_gujarat = 5
dmart_ahmedabad = 1          # shelf prices are sticky (changes are weeks apart) and the feed is refreshed on demand, so one observation day is a valid month

[index.min_matched_by_tier]
C = 1                       # administered prices (tariffs) have ONE legitimate quote by design
B = 1                       # benchmark series (e.g. gold) may be single-quote

[collectors]
user_agent = "RajkotPriceIndex/0.1 (student research project; contact: you@example.com)"
rent_crawl_budget = 18      # rent list URLs fetched per refresh (rotating; rpi/collectors/rent_listings.py), ~2 s apart
min_delay_seconds = 2.0
# City pincodes used for pincode-specific retail sources (VERIFY before use)
pincodes = ["360001", "360002", "360003", "360004", "360005"]

[agmarknet]
state = "Gujarat"
markets = ["Rajkot", "Gondal", "Jamnagar", "Morbi"]   # APMC market names - verify against live data
resource_id = "9ef84268-d588-465a-a308-a864a43d0070"  # data.gov.in daily mandi price resource (verify)
api_key_env = "DATA_GOV_API_KEY"

[health]
item_stale_days = 90        # an item whose quotes have not CHANGED for this many days is reported as stale (see `rpi health`)
item_stale_obs_days = 30     # an item whose newest quote is older than this many days is reported as a quiet feed
stale_days = { A = 3, B = 3, C = 45, D = 9999 }

[prereg]   # pre-registered live scoring of every gated series (rpi/prereg.py)
auto_demote = false   # true: a series flagged by the CUSUM is reverted to official_link automatically

[gates]
# Publication gates. The coverage gate (50% independent weight) is always on. The freshness gate is OFF unless
# `max_stale_weight_pct` is set here: refuse to publish when more than this share of basket weight has had no price
# change for longer than [health] item_stale_days days.
# max_stale_weight_pct = 25.0
